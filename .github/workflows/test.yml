name: Test nebari-sandbox action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-cluster-only:
    name: "cluster-only profile"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nebari Sandbox
        id: sandbox
        uses: nebari-dev/action-nebari-sandbox@main
        with:
          profile: cluster-only
          cluster-name: test-cluster

      - name: Verify cluster
        run: |
          kubectl get namespaces
          kubectl get pods -n kube-system
          kubectl create deployment nginx --image=nginx:alpine --replicas=1
          kubectl wait --for=condition=Available deployment/nginx --timeout=60s
          kubectl delete deployment nginx

      - name: Cleanup
        if: always()
        run: k3d cluster delete ${{ steps.sandbox.outputs.cluster-name }}

  test-platform:
    name: "platform profile"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false

      - name: Cache NIC Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: nic-go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            nic-go-${{ runner.os }}-

      - name: Setup Nebari Sandbox
        id: sandbox
        uses: nebari-dev/action-nebari-sandbox@main
        with:
          profile: platform
          cluster-name: nebari-platform-test
          resource-summary: "true"

      - name: Smoke test platform
        env:
          GATEWAY_IP: ${{ steps.sandbox.outputs.gateway-ip }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ steps.sandbox.outputs.keycloak-admin-password }}
        run: |
          kubectl get applications -n argocd
          curl -sk --resolve "keycloak.nebari.local:443:${GATEWAY_IP}" \
            https://keycloak.nebari.local/realms/master/.well-known/openid-configuration \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('issuer:', d['issuer'])"

      - name: Debug cluster state
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -A || true
          echo ""
          echo "=== ArgoCD Applications ==="
          kubectl get applications -n argocd -o wide || true
          echo ""
          echo "=== Recent warning events ==="
          kubectl get events -A --field-selector type=Warning --sort-by='.lastTimestamp' 2>/dev/null | tail -30 || true

      - name: Cleanup
        if: always()
        run: |
          k3d cluster delete ${{ steps.sandbox.outputs.cluster-name }}
          docker network rm ${{ steps.sandbox.outputs.network-name }} 2>/dev/null || true
